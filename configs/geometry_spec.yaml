# configs/geometry_spec.yaml
# Specification of physical unit cell geometry, materials, and solver settings.
# Per PLAN.md H1 and AGENTS.md rule 2, fields marked TODO must be supplied from the COMSOL .mph file.

a_um: 242.5                  # lattice constant used for normalisation
cell:
  x_um: 363.75
  y_um: 210.011
  n_lattice_points_in_cell: 1  # verified: 1 point (hexagonal lattice in a rhombus unit cell)
lattice: hexagonal           # verified: A1 = (a, 0), A2 = (a/2, sqrt(3)*a/2)
polarization: TE (H_z)       # verified: 2D TM in COMSOL terminology, corresponding to E=(Ex,Ey,0) and H=(0,0,Hz)
structures:
  para:
    background:
      eps_r: 9               # verified: Silicon with active n=3, ki=0 -> eps_r=9
    inclusions:              # list; coordinates relative to cell origin, in um
      - shape: clipped_triangle_down  # intersection of downward equilateral triangle and concentric circle
        eps_r: 1             # Air
        center_um: [242.5, 140.00744]
        size_params:
          L1: variable       # L1 is the side length of the parent downward triangle
      - shape: clipped_triangle_up    # intersection of upward equilateral triangle and concentric circle
        eps_r: 1             # Air
        center_um: [121.25, 70.00372]
        size_params:
          L2: variable       # L2 is the side length of the parent upward triangle
  r1:
    background:
      eps_r: 9               # verified: Silicon with active n=3, ki=0 -> eps_r=9
    inclusions:              # list; coordinates relative to cell origin, in um
      - shape: clipped_triangle_down  # intersection of downward equilateral triangle and concentric circle
        eps_r: 1             # Air
        center_um: [242.5, 140.00744]
        size_params:
          L1: variable       # L1 is the side length of the parent downward triangle
      - shape: clipped_triangle_up    # intersection of upward equilateral triangle and concentric circle
        eps_r: 1             # Air
        center_um: [121.25, 70.00372]
        size_params:
          L2: variable       # L2 is the side length of the parent upward triangle
k_path:                      # how k in [0.1, 2.9] maps to (kx, ky)
  segments: [[G, M], [M, K], [K, G]] # verified: k=0:G, k=1:M, k=2:K, k=3:G
  kink_indices: [90, 190]
solver:
  n_eigs_requested: 2
  search_around_GHz: 0       
  has_PML_or_loss: False     # verified: Floquet periodic boundaries, no PML
materials_dispersive_or_metal: False   # verified: eps is real and constant (n=3 and n=1, ki=0)
