# configs/criteria.yaml  (pre-registered evaluation criteria per AGENTS.md and PLAN.md)
priors:
  min_fraction_holding: 0.95

pwe_gate_H2:
  proceed_if_rel_mae_below: 0.05
  marginal_if_below: 0.15

pwe_gradcheck:
  dtype: float64
  max_rel_err: 1.0e-4

pwe_convergence:
  ref_M: 15
  max_rel_diff_at_chosen_M: 0.005

multifidelity:
  r1_lodo_mae_ratio_vs_gp_pca_max: 0.5
  para_lodo_mae_ratio_vs_gp_pca_max: 1.10
  edge_out_mae_ratio_vs_gp_pca_max: 0.8

inverse:
  lodo_roundtrip_param_err_um_max: 0.5
  reachability_factor: 3.0

blind:
  mae_ratio_vs_lodo_max: 1.5
  gap_edge_err_ghz_max: 2.0
